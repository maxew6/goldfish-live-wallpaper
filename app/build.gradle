plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onyx.goldfishwallpaper'
    compileSdk 34

    defaultConfig {
        applicationId "com.onyx.goldfishwallpaper"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs straight away.
            // Replace with your own keystore before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Intentionally dependency-free: only Android framework APIs (WallpaperService, android.graphics, WebView).
}

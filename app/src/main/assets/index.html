<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#160730">
<title>Goldfish Live Wallpaper</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #160730; color: #fff1ea;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; touch-action: none;
  }
  canvas#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* Flat, high-contrast dark glass. A live blur behind this panel would make the WebView re-composite
     a hardware layer over the animated canvas every frame, which shows up as flicker on mobile GPUs. */
  .hud {
    position: fixed; left: 50%; bottom: max(env(safe-area-inset-bottom), 14px);
    transform: translateX(-50%); width: min(calc(100% - 24px), 520px);
    padding: 12px; border-radius: 26px;
    background: rgba(8, 16, 26, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .hint { margin: 2px 6px 10px; font-size: 13px; line-height: 1.35; text-align: center; opacity: 0.82; }
  .seg {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px;
    border-radius: 999px; background: rgba(255, 255, 255, 0.08);
  }
  .seg button {
    height: 42px; border: 0; border-radius: 999px; background: none; color: #fff1ea;
    font: 600 14px/1 inherit;
  }
  .seg button[aria-pressed="true"] { background: linear-gradient(135deg, #f9d3c3, #e9a496); color: #2a0f3a; }
  body[data-mode="pond"] .seg button[aria-pressed="true"] { background: linear-gradient(135deg, #c6f7f1, #72d9d6); color: #032a33; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .btn { height: 54px; border: 0; border-radius: 18px; font: 650 16px/1 inherit; color: #fff1ea; }
  .btn.feed { flex: 0 0 auto; padding: 0 20px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.16); }
  .btn.set { flex: 1; color: #2a0f3a; background: linear-gradient(135deg, #f9d3c3, #e9a496 55%, #cf8190); }
  body[data-mode="pond"] .btn.set { color: #032a33; background: linear-gradient(135deg, #c6f7f1, #72d9d6 55%, #3bb0bb); }
  .btn:active { opacity: 0.85; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(max(env(safe-area-inset-bottom), 14px) + 196px);
    transform: translateX(-50%); max-width: calc(100% - 40px); padding: 10px 16px; border-radius: 999px;
    background: rgba(8, 16, 26, 0.92); font-size: 13px; text-align: center; opacity: 0; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body data-mode="love">
<canvas id="sea" aria-label="Animated goldfish aquarium"></canvas>

<section class="hud">
  <p class="hint">Tap or drag to make water ripples. Double-tap to feed the fish.</p>
  <div class="seg" id="seg" role="group" aria-label="Aquarium theme">
    <button type="button" data-mode="pond" aria-pressed="false">Natural Pond</button>
    <button type="button" data-mode="love" aria-pressed="true">Love Aquarium</button>
  </div>
  <div class="row">
    <button type="button" class="btn feed" id="feed">Feed Fish</button>
    <button type="button" class="btn set" id="set">Set Live Wallpaper</button>
  </div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ======================================================================
 *  Goldfish aquarium preview (Canvas 2D). Mirrors AquariumScene.java.
 *  The frame loop allocates nothing: no gradients, no paths, no strings.
 *  Gradients live in pre-rendered sprites / cached objects built at start-up or resize.
 * ==================================================================== */
var PI = Math.PI, TAU = PI * 2;
var N = 12, FISH_COUNT = 8, RAYS = 7, LINKS = 6, MAX_RIPPLES = 25, MAX_PELLETS = 48, MAX_BUBBLES = 30;

var WIDTH = [0.50, 0.82, 0.98, 1.00, 0.92, 0.79, 0.64, 0.50, 0.38, 0.28, 0.21, 0.16];
var RAY_LEN = [0.62, 0.92, 1.00, 0.52, 1.00, 0.92, 0.62];
var K_BASE = [0.50, 0.42, 0.34, 0.27, 0.22, 0.18];
var BODY_STOPS = [0, 0.32, 0.70, 0.93, 1];
var BODY = [
  [0xFFFFE9A8, 0xFFFFB52E, 0xFFFF8A00, 0xFFD25400, 0x00B03A00],
  [0xFFFFC9A0, 0xFFFF8142, 0xFFF04E12, 0xFFB5300A, 0x009A2400],
  [0xFFFFFFFF, 0xFFFFF1E2, 0xFFFFDCC0, 0xFFE9B08C, 0x00D08A60],
  [0xFFFFFFFF, 0xFFFFF4EE, 0xFFFFE3DB, 0xFFF0B5B0, 0x00D88A8A]

var EDGE = [0xC24A00, 0x9E2C08, 0xD39A78, 0xD9A09B];
var FIN = [0xFFA340, 0xFF6A2E, 0xFFC9A0, 0xFFB8B0];
var FIN2 = [0xFFC870, 0xFF9A62, 0xFFE9D6, 0xFFE0DA];
var PALETTE_PLAN = [0, 3, 1, 0, 2, 1, 0, 2];
var PEBBLES_POND = [0x8A8270, 0x6E6A5C, 0x9C927A, 0x5C5A52, 0x7A7462];
var PEBBLES_LOVE = [0xB5798F, 0x8E6AA8, 0xD9B5C4, 0x9A6C86, 0x6F5A88];

var canvas = document.getElementById('sea');
var ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

/* ---------- helpers ---------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ---------- sprites: all gradient shading is rendered once ---------- */

var bodySprite = BODY.map(function (c) { return radialSprite(BODY_STOPS, c, 128, -0.26, -0.32, 1.30); });
var blotchSprite = [
  radialSprite([0, 0.6, 1], [0xFFFF7A1A, 0xF0FF6A10, 0x00FF5A00], 128, 0, 0, 1),
  radialSprite([0, 0.6, 1], [0xFFE8271B, 0xF0D81E14, 0x00C81810], 128, 0, 0, 1)

  return makeSprite(64, function (g, s) {
    var r = s / 2, u = r / 1.35;
    g.fillStyle = col(edge, 190); g.beginPath(); g.arc(r, r, r, 0, TAU); g.fill();
    g.fillStyle = '#140a10'; g.beginPath(); g.arc(r, r, u, 0, TAU); g.fill();
    g.strokeStyle = '#e0a030'; g.lineWidth = u * 0.22; g.beginPath(); g.arc(r, r, u * 0.92, 0, TAU); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.94)'; g.beginPath(); g.arc(r - u * 0.32, r - u * 0.38, u * 0.30, 0, TAU); g.fill();

/* ---------- backdrop: gradient, sand, soft-shadowed pebbles (one bitmap per theme) ---------- */

function buildBackdrop(love) {
  var w = CW0(), h = CH0(), cv = makeCanvas(w, h), c = cv.getContext('2d'), r = mulberry(77);
  var bg = love ? [0xFF160730, 0xFF33124F, 0xFF5E2060, 0xFF8C3A6B] : [0xFF012A33, 0xFF04515E, 0xFF07757F, 0xFF0C9DA3];
  var glow = love ? [0x5CFF9EC8, 0x00FF9EC8] : [0x5078F0E8, 0x0078F0E8];
  var lg = c.createLinearGradient(0, 0, 0, h), stops = [0, 0.45, 0.8, 1], i;
  for (i = 0; i < 4; i++) lg.addColorStop(stops[i], css(bg[i]));

  rg.addColorStop(0, css(glow[0])); rg.addColorStop(1, css(glow[1]));

    var rx = u * (0.012 + 0.050 * r() * r()), ry = rx * (0.60 + 0.30 * r()), base = 0xFF000000 | pal[Math.floor(r() * pal.length)];

    pg.addColorStop(0, css(lighten(base, 0.35))); pg.addColorStop(0.55, css(base)); pg.addColorStop(1, css(darken(base, 0.55)));

    c.fillStyle = 'rgba(255,255,255,0.33)'; c.beginPath(); c.ellipse(-rx * 0.30, -ry * 0.42, rx * 0.25, ry * 0.20, 0, 0, TAU); c.fill();

function CW0() { return Math.max(2, Math.round(W * DPR)); }
function CH0() { return Math.max(2, Math.round(H * DPR)); }

function buildCausticPattern(love) {

  var r = love ? 255 : 205, g = love ? 190 : 255, b = love ? 222 : 255;
  for (var y = 0; y < s; y++) {
    for (var x = 0; x < s; x++) {
      var u = x / s * TAU, v = y / s * TAU;
      var a = Math.sin(u * 2 + 1.4 * Math.sin(v * 3 + 0.6)), bb = Math.sin(v * 2 + 1.4 * Math.sin(u * 3 + 2.1)), cc = Math.sin(u + v + 1.2 * Math.sin(u * 2 - v * 2));

      d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = Math.floor(ln * 255);

function buildOverlay() {
  var w = CW0(), h = CH0(), cv = makeCanvas(w, h), c = cv.getContext('2d');
  var dg = c.createLinearGradient(0, 0, 0, h); dg.addColorStop(0, 'rgba(0,0,0,0)'); dg.addColorStop(1, 'rgba(0,0,24,0.227)');
  c.fillStyle = dg; c.fillRect(0, 0, w, h);
  var diag = Math.sqrt(w * w + h * h), vg = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, diag * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.5, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,20,0.455)');
  c.fillStyle = vg; c.fillRect(0, 0, w, h);

/* ---------- model ---------- */
function F(n) { return new Float32Array(n); }
function makeTail(length, spread, phase) { return { px: F(RAYS * (LINKS + 1)), py: F(RAYS * (LINKS + 1)), length: length, spread: spread, phase: phase }; }
function makeFish() {
  return {
    x: 0, y: 0, ang: 0, speed: 0, len: 100, cruise: 50, sn: 0,
    phase: 0, pecPhaseL: 0, pecPhaseR: 0, pelPhaseL: 0, pelPhaseR: 0,
    dart: 0, dartAng: 0, attractT: 0, attractX: 0, attractY: 0, tx: 0, ty: 0, retarget: 0,
    palette: 0, pairIdx: 0, slot: 0,
    sx: F(N), sy: F(N), rx: F(N), ry: F(N), dx: F(N), dy: F(N), hw: F(N),
    bj: [0, 0, 0], bo: [0, 0, 0], bs: [0, 0, 0], bc: [0, 0, 0], blotches: 0,
    tailA: makeTail(0.80, 0.30, 0), tailB: makeTail(0.56, 0.25, 1.3),
    bodyX: F(2 * N + 4), bodyY: F(2 * N + 4), bodyM: 0,
    dorX: F(2 * N + 4), dorY: F(2 * N + 4), dorM: 0,
    spX: F(2 * N + 4), spY: F(2 * N + 4), spM: 0

}
var fish = [], pairs = [], ripples = [], pellets = [], bubbles = [], linkK = F(LINKS), i0;
for (i0 = 0; i0 < FISH_COUNT; i0++) fish.push(makeFish());
for (i0 = 0; i0 < FISH_COUNT / 2; i0++) pairs.push({ cx: 0, cy: 0, ang: 0, speed: 0, tx: 0, ty: 0, retarget: 0, phi: 0, phiSpeed: 0, d: 0, e: 0, seed: 0 });
for (i0 = 0; i0 < MAX_RIPPLES; i0++) ripples.push({ active: false, x: 0, y: 0, maxR: 0, age: 0, life: 1 });
for (i0 = 0; i0 < MAX_PELLETS; i0++) pellets.push({ on: false, x: 0, y: 0, vy: 0, phase: 0, life: 0 });
for (i0 = 0; i0 < MAX_BUBBLES; i0++) bubbles.push({ x: 0, y: 0, r: 1, vy: 0, phase: 0 });

var tX = F(N), tY = F(N), tW = F(N), uX = F(N), uY = F(N), oX = F(2 * N + 4), oY = F(2 * N + 4);

function startRipple(x, y, maxR, life, delay) {
  for (var i = 0; i < MAX_RIPPLES; i++) {
    var r = ripples[i];
    if (!r.active) { r.x = x; r.y = y; r.maxR = maxR; r.life = life; r.age = delay; r.active = true; return; }

}
function pickTarget(f) {
  var mx = Math.min(f.len * 0.9, W * 0.4), my = Math.min(f.len * 0.9, H * 0.4);
  f.tx = rand(mx, W - mx); f.ty = rand(my, H - my); f.retarget = rand(5, 11);
}
function pickPairTarget(p) {
  var mx = Math.min(unit * 0.22, W * 0.4), my = Math.min(unit * 0.22, H * 0.4);
  p.tx = rand(mx, W - mx); p.ty = rand(my, H - my); p.retarget = rand(8, 16);

function initFish() {

    var q = pairs[k];
    q.cx = W * rand(0.28, 0.72); q.cy = H * (0.16 + 0.22 * k + rand(-0.03, 0.03));
    q.ang = rand(0, TAU); q.phi = rand(0, TAU); q.phiSpeed = rand(0.45, 0.70); q.seed = rand(0, 10);

    f.phase = rand(0, TAU); f.pecPhaseL = rand(0, TAU); f.pecPhaseR = rand(0, TAU); f.pelPhaseL = rand(0, TAU); f.pelPhaseR = rand(0, TAU);

      f.bj[1] = rand(3.7, 4.7); f.bo[1] = rand(-0.35, 0.35); f.bs[1] = rand(0.85, 1.2); f.bc[1] = 0;

function initBubbles() {

/* ---------- simulation ---------- */
function updatePair(p, k, dt) {

    if (ib >= N - 1) ib = N - 2;
    var tb = ub - ib, hwHere = f.hw[ib] + (f.hw[ib + 1] - f.hw[ib]) * tb, rad = f.bs[b] * hwHere;
    var bx = f.rx[ib] + (f.rx[ib + 1] - f.rx[ib]) * tb - f.dy[ib] * f.bo[b] * hwHere, by = f.ry[ib] + (f.ry[ib + 1] - f.ry[ib]) * tb + f.dx[ib] * f.bo[b] * hwHere;
    ctx.globalAlpha = 225 / 255; ctx.drawImage(blotchSprite[f.bc[b] === 1 ? 1 : 0], bx - rad, by - rad, rad * 2, rad * 2); ctx.globalAlpha = 1;
  }
  /* scale crescents */
  ctx.lineWidth = dens * 0.9; ctx.strokeStyle = col(EDGE[p], 44); ctx.beginPath();
  for (i = 2; i <= 8; i++) {
    var hwI = f.hw[i], rs = Math.min(len / (N - 1) * 0.62, hwI * 0.40), cnt = (i & 1) === 0 ? 3 : 2, back = Math.atan2(-f.dy[i], -f.dx[i]), a0 = back - 68 * PI / 180;
    for (s = 0; s < cnt; s++) {
      var off = cnt === 3 ? (s - 1) * 0.58 : (s - 0.5) * 0.58, ccx = f.rx[i] - f.dy[i] * off * hwI, ccy = f.ry[i] + f.dx[i] * off * hwI;
      ctx.moveTo(ccx + Math.cos(a0) * rs, ccy + Math.sin(a0) * rs); ctx.arc(ccx, ccy, rs, a0, back + 68 * PI / 180);
    }
  }

  ctx.beginPath(); ctx.arc(f.rx[2] - 0.30 * f.hw[2], f.ry[2] - 0.42 * f.hw[2], f.hw[2] * 0.13, 0, TAU); ctx.fillStyle = col(0xFFFFFF, 170); ctx.fill();
  /* gill cover */
  var nx2 = -f.dy[2], ny2 = f.dx[2], gx = f.rx[3] + (f.rx[3] - f.rx[2]) * 0.4, gy = f.ry[3] + (f.ry[3] - f.ry[2]) * 0.4;
  ctx.beginPath(); ctx.moveTo(f.rx[2] + nx2 * f.hw[2] * 0.88, f.ry[2] + ny2 * f.hw[2] * 0.88); ctx.quadraticCurveTo(gx, gy, f.rx[2] - nx2 * f.hw[2] * 0.88, f.ry[2] - ny2 * f.hw[2] * 0.88);
  ctx.lineWidth = dens * 1.2; ctx.strokeStyle = col(EDGE[p], 78); ctx.stroke();
  /* dorsal crest */
  emitRibbon(ctx, f.dorX, f.dorY, f.dorM, 0, 0); ctx.fillStyle = col(FIN2[p], 125); ctx.fill(); ctx.lineWidth = dens * 0.8; ctx.strokeStyle = col(FIN[p], 150); ctx.stroke();
  /* pectoral fins */
  var pecBase = 1.02 - 0.42 * Math.min(1, f.sn);
  drawFin(f, 2, 1, 0.92, pecBase + 0.40 * Math.sin(f.pecPhaseL), len * 0.21, f.pecPhaseL + 0.6, p, 1);
  drawFin(f, 2, -1, 0.92, pecBase + 0.40 * Math.sin(f.pecPhaseR), len * 0.21, f.pecPhaseR + 1.7, p, 1);
  /* eyes */
  for (s = -1; s <= 1; s += 2) {
    var ex = f.rx[1] - f.dy[1] * s * f.hw[1] * 0.80, ey = f.ry[1] + f.dx[1] * s * f.hw[1] * 0.80, er = f.hw[1] * 0.24 * 1.35;
    ctx.drawImage(eyeSprite[p], ex - er, ey - er, er * 2, er * 2);
  }
}
function drawPellets() {
  var r = unit * 0.0085;
  for (var i = 0; i < MAX_PELLETS; i++) {
    var p = pellets[i];
    if (!p.on) continue;
    var a = Math.min(1, p.life / 1.5);
    ctx.beginPath(); ctx.arc(p.x + r * 0.9, p.y + r * 1.3, r, 0, TAU); ctx.fillStyle = col(0x000010, Math.floor(46 * a)); ctx.fill();
    ctx.globalAlpha = a; ctx.drawImage(pelletSprite, p.x - r, p.y - r, r * 2, r * 2); ctx.globalAlpha = 1;
  }
}
function drawRipples() {
  var ring = loveMode ? 0xFFD6EC : 0xCFF7FF, spark = loveMode ? 0xFFF0F6 : 0xEFFFFF;
  for (var i = 0; i < MAX_RIPPLES; i++) {
    var r = ripples[i];
    if (!r.active || r.age < 0) continue;
    var t = r.age / r.life, e = 1 - (1 - t) * (1 - t), rad = r.maxR * e;
    if (rad < 1) continue;
    var a = (1 - t) * (1 - t);
    ctx.lineWidth = dens * (2.6 - 1.4 * t); ctx.strokeStyle = col(ring, Math.floor(235 * a)); ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
    ctx.lineWidth = dens * 1.3; ctx.strokeStyle = col(ring, Math.floor(150 * a)); ctx.beginPath(); ctx.arc(r.x, r.y, rad * 0.78, 0, TAU); ctx.stroke();
    ctx.strokeStyle = col(ring, Math.floor(80 * a)); ctx.beginPath(); ctx.arc(r.x, r.y, rad * 0.56, 0, TAU); ctx.stroke();
    for (var k = 0; k < 6; k++) {
      var an = k * TAU / 6 + r.age * 1.6, tw = Math.sin(r.age * 9 + k * 2);
      ctx.fillStyle = col(spark, Math.floor(255 * a * (0.35 + 0.65 * tw * tw)));
      ctx.beginPath(); ctx.arc(r.x + Math.cos(an) * rad, r.y + Math.sin(an) * rad, dens * (1.2 + 1.2 * a), 0, TAU); ctx.fill();
    }
  }
}
function render() {
  drawBackdrop(); drawBubbles();
  var i;
  for (i = 0; i < FISH_COUNT; i++) drawShadow(fish[i]);
  for (i = 0; i < FISH_COUNT; i++) drawFish(fish[i]);
  drawPellets(); drawRipples();
}

/* ---------- interaction: ripples and fish only ---------- */
var touching = false, touchX = 0, touchY = 0, lastEmitX = 0, lastEmitY = 0, lastTapT = 0, lastTapX = 0, lastTapY = 0, activePointer = -1;
function touchDown(x, y) {
  touching = true; touchX = x; touchY = y; lastEmitX = x; lastEmitY = y;
  startRipple(x, y, unit * 0.26, 1.7, 0); startRipple(x, y, unit * 0.17, 1.3, -0.18);
  scare(x, y);
  for (var i = 0; i < FISH_COUNT; i++) {                      // curious fish drift over to look
    var f = fish[i], dx = f.x - x, dy = f.y - y, far = f.len * 3.2;
    if (f.dart <= 0 && f.attractT <= 0 && dx * dx + dy * dy < far * far) { f.attractT = rand(3, 5); f.attractX = x; f.attractY = y; }
  }
}
function touchMove(x, y) {
  touchX = x; touchY = y;
  var dx = x - lastEmitX, dy = y - lastEmitY, step = unit * 0.045;
  if (dx * dx + dy * dy > step * step) { startRipple(x, y, unit * 0.15, 1.1, 0); lastEmitX = x; lastEmitY = y; }
  scare(x, y);
}
function feed(x, y) {
  startRipple(x, y, unit * 0.20, 1.4, 0);
  var dropped = 0;
  for (var i = 0; i < MAX_PELLETS; i++) {
    var p = pellets[i];
    if (p.on) continue;
    var a = rand(0, TAU), r = Math.sqrt(rnd()) * unit * 0.07;
    p.on = true; p.x = x + Math.cos(a) * r; p.y = y + Math.sin(a) * r; p.vy = unit * rand(0.022, 0.040); p.phase = rand(0, TAU); p.life = rand(13, 18);
    if (++dropped >= 9) break;
  }
}
canvas.addEventListener('pointerdown', function (e) {
  if (activePointer !== -1) return;
  activePointer = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  var now = performance.now(), x = e.clientX, y = e.clientY, dx = x - lastTapX, dy = y - lastTapY;
  if (now - lastTapT < 360 && dx * dx + dy * dy < unit * unit * 0.02) { feed(x, y); lastTapT = 0; }
  else { lastTapT = now; lastTapX = x; lastTapY = y; touchDown(x, y); }
  e.preventDefault();
});
canvas.addEventListener('pointermove', function (e) { if (e.pointerId === activePointer) touchMove(e.clientX, e.clientY); });
function endPointer(e) { if (e.pointerId === activePointer) { activePointer = -1; touching = false; } }
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- HUD / Android bridge ---------- */
var bridge = window.Android && typeof window.Android.applyLiveWallpaper === 'function' ? window.Android : null;
var toastEl = document.getElementById('toast'), toastTimer = 0, seg = document.getElementById('seg');
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2800); }
function setMode(mode, persist) {
  loveMode = mode !== 'pond';
  document.body.setAttribute('data-mode', loveMode ? 'love' : 'pond');
  var btns = seg.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', String((btns[i].getAttribute('data-mode') === 'love') === loveMode));
  for (i = 0; i < FISH_COUNT; i++) pickTarget(fish[i]);
  for (i = 0; i < pairs.length; i++) { var a = fish[2 * i], b = fish[2 * i + 1]; pairs[i].cx = (a.x + b.x) * 0.5; pairs[i].cy = (a.y + b.y) * 0.5; pairs[i].ang = a.ang; pickPairTarget(pairs[i]); }
  if (persist && bridge && typeof bridge.saveMode === 'function') bridge.saveMode(loveMode ? 'love' : 'pond');
}
seg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setMode(b.getAttribute('data-mode'), true); });
document.getElementById('feed').addEventListener('click', function () { feed(W * rand(0.3, 0.7), H * rand(0.16, 0.30)); });
document.getElementById('set').addEventListener('click', function () {
  if (bridge) bridge.applyLiveWallpaper(loveMode ? 'love' : 'pond');
  else toast('Open this page inside the Android app to set the wallpaper.');
});

/* ---------- sizing: DPR clamped to 2, adaptive render scale ---------- */
function applyScale() {
  CW = Math.max(2, Math.round(W * DPR * quality)); CH = Math.max(2, Math.round(H * DPR * quality));
  canvas.width = CW; canvas.height = CH;
  ctx.setTransform(CW / W, 0, 0, CH / H, 0, 0);
}
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight); unit = Math.min(W, H); dens = Math.max(0.75, unit / 360);
  DPR = Math.min(window.devicePixelRatio || 1, 2.0);
  applyScale();
  backdrops.love = backdrops.pond = null;
  causticPattern.love = buildCausticPattern(true); causticPattern.pond = buildCausticPattern(false);
  var h0 = CH0();
  beamGrad = { love: null, pond: null };
  [['love', [0x34FFD6EC, 0x00FFD6EC]], ['pond', [0x30D2FFFF, 0x00D2FFFF]]].forEach(function (e) {
    var g = ctx.createLinearGradient(0, 0, 0, H * 0.85); g.addColorStop(0, css(e[1][0])); g.addColorStop(1, css(e[1][1])); beamGrad[e[0]] = g;
  });
  overlay = buildOverlay();
  backdrops[loveMode ? 'love' : 'pond'] = buildBackdrop(loveMode);
  initFish(); initBubbles();
  for (var i = 0; i < MAX_PELLETS; i++) pellets[i].on = false;
  for (i = 0; i < MAX_RIPPLES; i++) ripples[i].active = false;
  void h0;
  setTimeout(function () { var k = loveMode ? 'pond' : 'love'; if (!backdrops[k]) backdrops[k] = buildBackdrop(!loveMode); }, 400);
}
var resizeTimer = 0;
window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

/* ---------- loop ---------- */
var lastT = 0, lastDraw = 0, workEma = 8, slow = 0, raf = 0;
function frame(t) {
  raf = requestAnimationFrame(frame);
  if (t - lastDraw < 15) return;                                  // cap at ~60 FPS (45 on 90 Hz, 60 on 120 Hz)
  var dt = lastT ? Math.min(0.033, (t - lastT) / 1000) : 1 / 60;  // real elapsed time, clamped
  lastT = t; lastDraw = t;
  var w0 = performance.now();
  update(dt, dt * 60);                                            // dtScale = dt * 60: identical speed at any refresh rate
  render();
  workEma += (performance.now() - w0 - workEma) * 0.05;
  if (workEma > 20) { if (++slow > 120 && quality > 0.6) { quality = Math.max(0.6, quality * 0.88); applyScale(); slow = 0; } } else slow = Math.max(0, slow - 2);

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { cancelAnimationFrame(raf); } else { lastT = 0; raf = requestAnimationFrame(frame); }
});

if (bridge && typeof bridge.getMode === 'function') loveMode = bridge.getMode() !== 'pond';
resize();
setMode(loveMode ? 'love' : 'pond', false);
raf = requestAnimationFrame(frame);
window.__aquarium = { step: function (s) { for (var i = 0; i < Math.round(s * 60); i++) update(1 / 60, 1); render(); }, touchDown: touchDown, touchMove: touchMove, feed: feed, setMode: function (m) { setMode(m, false); } };
})();
